name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "cryptography>=45,<47" "psycopg[binary]>=3.2,<4" "pyjwt>=2.10,<3" "pytest>=8,<10" "sqlglot>=26,<27" "uvicorn[standard]>=0.34,<1"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/experience-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/experience-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate-compose.sh
      - run: docker build --file Dockerfile.control --tag orqestra-control:ci .
      - run: docker build --file Dockerfile.web --tag orqestra-web:ci .

  live-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=45,<47" "psycopg[binary]>=3.2,<4" "pyjwt>=2.10,<3" "pytest>=8,<10" "sqlglot>=26,<27" "uvicorn[standard]>=0.34,<1"
      - run: ./scripts/test-live-postgres.sh
