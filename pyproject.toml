[project]
name = "orqestra"
version = "0.1.0"
description = "AI-native autonomous data platform foundations"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<47",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "sqlglot>=26,<27",
    "uvicorn[standard]>=0.34,<1",
]

[tool.pytest.ini_options]
markers = [
    "live: tests requiring Docker-backed services",
]
pythonpath = [
    "packages/execution_kernel",
    "packages/task_runtime",
    "packages/approval_plane",
    "packages/governance",
    "packages/memory_service",
    "packages/connector_execution",
    "packages/control_api",
    "packages/read_workflows",
    "packages/workflow_reliability",
    "packages/semantic_catalog",
    "packages/governed_orchestrator",
]
testpaths = [
    "packages/execution_kernel/tests",
    "packages/task_runtime/tests",
    "packages/approval_plane/tests",
    "packages/governance/tests",
    "packages/memory_service/tests",
    "packages/connector_execution/tests",
    "packages/control_api/tests",
    "packages/read_workflows/tests",
    "packages/workflow_reliability/tests",
    "packages/semantic_catalog/tests",
    "tests/integration",
    "packages/governed_orchestrator/tests",
]
